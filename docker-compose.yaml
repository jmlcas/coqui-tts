services:

    tts-cpu:
        image: ghcr.io/coqui-ai/tts-cpu
        container_name: coqui
        stdin_open: true
        tty: true
        ports:
            - "5002:5002"
        entrypoint:
            - /bin/bash
        restart: unless-stopped
        entrypoint:
            - /bin/bash
#        command: -c "python3 TTS/server/server.py --model_name tts_models/en/vctk/vits"           # Voz inglés
#        command: -c "python3 TTS/server/server.py --model_name tts_models/es/css10/vits"          # Voz español hombre
        command: -c "python3 TTS/server/server.py --model_name tts_models/es/mai/tacotron2-DDC"   # Voz español mujer
